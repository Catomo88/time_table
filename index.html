<html lang="ko">

<title>우리집 일정</title>
<style>
:root{--ink:#1C1F26;--mut:#878C96;--line:#E6E8EC;--k1:#2F6BDF;--k2:#C4661F;--wk:#7B53C6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;background:#F4F5F7;color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:18px 14px 36px}
.bh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
h1{font-size:19px;font-weight:800;letter-spacing:-.02em}
.rng{font-size:11px;color:var(--mut);margin-top:3px}
.seg{display:inline-flex;background:#E7E9ED;border-radius:99px;padding:3px;flex-shrink:0}
.seg button{border:none;background:none;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:99px;cursor:pointer;color:#7C8089}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wkbar{font-size:11.5px;background:#F3EEFC;color:#5B3AA6;border:1px solid #E3D9F7;border-radius:10px;padding:8px 11px;margin-bottom:12px;font-weight:700;display:none}
.hero{background:#fff;border-radius:16px;border:1px solid #E4E7EC;box-shadow:0 6px 18px rgba(23,32,64,.06);padding:16px;margin-bottom:16px}
.ht{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.hn{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.hm .a{font-size:13px;font-weight:700}
.hm .b{font-size:11px;color:var(--mut);margin-top:2px}
.tdp{margin-left:auto;font-size:11px;font-weight:700;color:#fff;background:var(--k1);padding:4px 10px;border-radius:99px}
.stat{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.st{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:8px;background:#F0F4FD;color:var(--k1)}
.st.now{background:#FDEEEE;color:#D64545}
.row{display:grid;grid-template-columns:44px 42px 1fr;gap:8px;padding:7px 8px;border-radius:10px;align-items:baseline}
.row .t{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.kt{font-size:11px;font-weight:700;text-align:center;border-radius:6px;padding:2px 0}
.kt1{color:var(--k1);background:#EBF1FC}.kt2{color:var(--k2);background:#FBEFE3}
.row .ti{font-size:13.5px;font-weight:700;word-break:keep-all}
.row .sub{font-size:11px;color:var(--mut);margin-top:1px}
.row.past{opacity:.4}
.row.cur{background:#FDF3F2;box-shadow:inset 3px 0 0 #D64545}
.row.ghost .ti{text-decoration:line-through;color:#A7ABB2}
.tag{font-size:10.5px;font-weight:800;margin-left:6px;padding:1px 6px;border-radius:6px}
.tag.n{color:#fff;background:#D64545}.tag.w{color:#fff;background:var(--wk)}.tag.c{color:#6B6F76;background:#E9EAED}
.sec{font-size:12px;font-weight:800;color:var(--mut);margin:0 2px 8px}
.card{background:#fff;border-radius:14px;border:1px solid var(--line);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.ch{display:flex;align-items:baseline;gap:8px}
.cd{font-size:14px;font-weight:800}.cd.we{color:#C25B5B}
.cdt{font-size:11px;color:#B0B4BC}
.cnt{margin-left:auto;font-size:11px;color:var(--mut)}
.cnt .wd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--wk);margin-left:5px;vertical-align:1px}
.kline{display:flex;gap:8px;margin-top:7px;font-size:12.5px;line-height:1.5}
.kline .nm{font-weight:800;flex-shrink:0}
.nm1{color:var(--k1)}.nm2{color:var(--k2)}
.kline .ch2{color:#4B5058;word-break:keep-all}
.kline .ar{color:#C6CAD1}
.none{color:#B0B4BC}
.cx{display:none;margin-top:8px;border-top:1px solid #F0F1F4;padding-top:6px}
.card.open .cx{display:block}
.cx .row{padding:5px 4px}
.foot{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.foot a{font-size:12.5px;font-weight:700;padding:8px 13px;border-radius:10px;border:1px solid #E0DDD6;background:#fff;color:#4A4E55;text-decoration:none}

.req{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:18px}
.req h2{font-size:15px;font-weight:800;margin-bottom:4px}
.req p{font-size:12px;color:var(--mut);margin-bottom:9px;line-height:1.5}
.req textarea{width:100%;min-height:72px;border:1px solid #D7DBE0;border-radius:11px;padding:10px 11px;font-size:14px;font-family:inherit;resize:vertical}
.req textarea:focus,.req input:focus{outline:2px solid var(--k1);border-color:var(--k1)}
.btnrow{display:flex;gap:8px;margin-top:9px}
.btn{flex:1;font-size:14.5px;font-weight:800;padding:11px;border:none;border-radius:11px;cursor:pointer;background:#2E8B57;color:#fff}
.btn.sub{flex:0 0 auto;background:#EEF1F4;color:#333;padding:11px 14px}
.msg{font-size:12.5px;font-weight:700;margin-top:8px;min-height:16px;color:var(--mut)}
.msg.ok{color:#2E8B57}.msg.err{color:#C0392B}
details{margin-top:11px;border-top:1px solid #F0F1F4;padding-top:9px}
summary{font-size:12px;color:var(--k1);cursor:pointer;font-weight:700}
.tokrow{display:flex;gap:8px;margin-top:8px}
.tokrow input{flex:1;border:1px solid #D7DBE0;border-radius:10px;padding:9px 10px;font-size:13px}
.tokrow button{font-size:12.5px;font-weight:700;border:1px solid #2E8B57;background:#fff;color:#2E8B57;border-radius:10px;padding:0 12px;cursor:pointer}
.help{font-size:11px;color:#9AA0A6;line-height:1.6;margin-top:7px}
.help a{color:var(--k1)}

.evbox{background:#FFF7EC;border:1px solid #F2DFC2;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.evbox .t{font-size:12px;font-weight:800;color:#9A6412;margin-bottom:6px}
.evrow{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:3px 0}
.evrow .d{font-size:11px;font-weight:800;color:#B4771F;background:#FBEBD3;border-radius:6px;padding:2px 7px;white-space:nowrap}
.evrow .n{font-weight:700;word-break:keep-all}
.evrow .w{font-size:11px;color:#9A8A72}

.nav{display:flex;gap:8px;margin-bottom:14px}
.nav a{flex:1;text-align:center;font-size:13.5px;font-weight:800;padding:11px 10px;border-radius:12px;text-decoration:none;background:#fff;border:1px solid var(--line);color:#31363E}
.nav a.pri{background:var(--k1);border-color:var(--k1);color:#fff}
</style>
</head>

    </details>
  </div>
  
</div>
<script>
var DATA = [{"who": "첫째", "day": "월", "s": "08:20", "e": "08:45", "title": "등교", "cat": "care", "place": "집→학교", "assumed": false, "note": ""}, {"who": "첫째", "day": "월", "s": "08:45", "e": "13:30", "title": "정규수업", "cat": "school", "place": "○○초", "assumed": false, "note": ""}, {"who": "첫째", "day": "월", "s": "15:20", "e": "16:10", "title": "한글수업", "cat": "academy", "place": "한글교실", "assumed": false, "note": ""}, {"who": "첫째", "day": "화", "s": "08:20", "e": "08:45", "title": "등교", "cat": "care", "place": "집→학교", "assumed": false, "note": ""}, {"who": "첫째", "day": "화", "s": "08:45", "e": "13:30", "title": "정규수업", "cat": "school", "place": "○○초", "assumed": false, "note": ""}, {"who": "첫째", "day": "화", "s": "14:00", "e": "15:00", "title": "태권도", "cat": "academy", "place": "태권도장", "assumed": false, "note": ""}, {"who": "첫째", "day": "화", "s": "16:00", "e": "16:30", "title": "피아노", "cat": "academy", "place": "피아노학원", "assumed": false, "note": ""}, {"who": "첫째", "day": "수", "s": "08:20", "e": "08:45", "title": "등교", "cat": "care", "place": "집→학교", "assumed": false, "note": ""}, {"who": "첫째", "day": "수", "s": "08:45", "e": "12:50", "title": "정규수업(단축)", "cat": "school", "place": "○○초", "assumed": false, "note": ""}, {"who": "첫째", "day": "목", "s": "08:20", "e": "08:45", "title": "등교", "cat": "care", "place": "집→학교", "assumed": false, "note": ""}, {"who": "첫째", "day": "목", "s": "08:45", "e": "13:30", "title": "정규수업", "cat": "school", "place": "○○초", "assumed": false, "note": ""}, {"who": "첫째", "day": "목", "s": "13:40", "e": "15:10", "title": "방과후 큐보로봇", "cat": "after", "place": "학교", "assumed": false, "note": "유료"}, {"who": "첫째", "day": "목", "s": "17:10", "e": "18:10", "title": "영어수업", "cat": "academy", "place": "한글교실", "assumed": false, "note": ""}, {"who": "첫째", "day": "금", "s": "08:20", "e": "08:45", "title": "등교", "cat": "care", "place": "집→학교", "assumed": false, "note": ""}, {"who": "첫째", "day": "금", "s": "08:45", "e": "12:50", "title": "정규수업(단축)", "cat": "school", "place": "○○초", "assumed": false, "note": ""}, {"who": "첫째", "day": "금", "s": "12:50", "e": "14:20", "title": "맞춤형 종이접기", "cat": "after", "place": "학교", "assumed": false, "note": "무료"}, {"who": "첫째", "day": "금", "s": "14:40", "e": "16:00", "title": "미술학원", "cat": "academy", "place": "미술학원", "assumed": false, "note": ""}, {"who": "첫째", "day": "금", "s": "16:00", "e": "17:00", "title": "태권도", "cat": "academy", "place": "태권도장", "assumed": false, "note": "둘째와 함께 · 이모님 픽업"}, {"who": "둘째", "day": "월", "s": "09:10", "e": "15:10", "title": "유치원", "cat": "school", "place": "유치원", "assumed": false, "note": ""}, {"who": "둘째", "day": "월", "s": "16:20", "e": "16:50", "title": "한글수업", "cat": "academy", "place": "한글교실", "assumed": false, "note": ""}, {"who": "둘째", "day": "화", "s": "09:10", "e": "15:10", "title": "유치원", "cat": "school", "place": "유치원", "assumed": false, "note": ""}, {"who": "둘째", "day": "수", "s": "09:10", "e": "15:10", "title": "유치원", "cat": "school", "place": "유치원", "assumed": false, "note": ""}, {"who": "둘째", "day": "수", "s": "16:10", "e": "16:40", "title": "한글수업", "cat": "academy", "place": "한글교실", "assumed": false, "note": ""}, {"who": "둘째", "day": "목", "s": "09:10", "e": "15:10", "title": "유치원", "cat": "school", "place": "유치원", "assumed": false, "note": ""}, {"who": "둘째", "day": "금", "s": "09:10", "e": "15:10", "title": "유치원", "cat": "school", "place": "유치원", "assumed": false, "note": "하원 시간 늘림"}, {"who": "둘째", "day": "금", "s": "16:00", "e": "17:00", "title": "태권도", "cat": "academy", "place": "태권도장", "assumed": false, "note": "첫째와 함께 · 이모님 픽업"}, {"who": "첫째", "day": "수", "s": "19:30", "e": "20:10", "title": "첼로", "cat": "academy", "place": "첼로교실", "assumed": false, "note": ""}, {"who": "첫째", "day": "일", "s": "16:10", "e": "17:10", "title": "수영", "cat": "academy", "place": "수영장", "assumed": false, "note": ""}, {"who": "첫째", "day": "화", "s": "19:00", "e": "19:30", "title": "화상영어", "cat": "academy", "place": "온라인", "assumed": false, "note": ""}, {"who": "첫째", "day": "금", "s": "19:00", "e": "19:30", "title": "화상영어", "cat": "academy", "place": "온라인", "assumed": false, "note": ""}, {"who": "둘째", "day": "수", "s": "19:30", "e": "20:00", "title": "축구", "cat": "academy", "place": "축구교실", "assumed": true, "note": "추정"}, {"who": "첫째", "day": "수", "s": "16:50", "e": "17:40", "title": "한글수업", "cat": "academy", "place": "한글교실", "assumed": true, "note": "추정"}, {"who": "첫째", "day": "수", "s": "12:50", "e": "14:20", "title": "방과후 아나운서", "cat": "after", "place": "학교", "assumed": false, "note": "유료"}, {"who": "첫째", "day": "월", "s": "14:00", "e": "15:00", "title": "태권도", "cat": "academy", "place": "태권도장", "assumed": false, "note": ""}, {"who": "둘째", "day": "목", "s": "16:00", "e": "17:00", "title": "태권도", "cat": "academy", "place": "태권도장", "assumed": false, "note": ""}];
var OVERRIDES = {};
var EVENTS = [{"start": "2026-08-29", "end": "2026-08-29", "who": "가족", "title": "다영이네랑 충청도", "s": "", "e": "", "note": ""}];
var DAYS=["월","화","수","목","금","토","일"],NAME={"첫째":"서원","둘째":"서준"},MODE="week";
function mk(d){var x=new Date(d),w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)}
var NOW=new Date(),TD=(NOW.getDay()+6)%7,NM=NOW.getHours()*60+NOW.getMinutes();
var MON=new Date(NOW);MON.setDate(NOW.getDate()-TD);
var WKEY=mk(NOW),WOPS=OVERRIDES[WKEY]||[];
function t2m(s){var p=s.split(":");return +p[0]*60+ +p[1]}
function dOf(i){var t=new Date(MON);t.setDate(MON.getDate()+i);return t}
function mI(x,m){for(var k in m){if(x[k]!==m[k])return false}return true}
function eff(){
  if(MODE!=="week")return{items:DATA,removed:[]};
  var it=DATA.map(function(o){var c={};for(var k in o)c[k]=o[k];return c}),rm=[];
  WOPS.forEach(function(o){
    if(o.op==="add"){var n={place:"",note:""};for(var k in o.item)n[k]=o.item[k];n._wk=1;it.push(n)}
    else if(o.op==="remove"){it=it.filter(function(x){if(mI(x,o.match)){var g={};for(var k in x)g[k]=x[k];rm.push(g);return false}return true})}
    else if(o.op==="update"){it.forEach(function(x){if(mI(x,o.match)){for(var k in o.set)x[k]=o.set[k];x._wk=1}})}
  });
  return{items:it,removed:rm};
}
function setMode(m){MODE=m;document.getElementById("mw").className=m==="week"?"on":"";document.getElementById("mb").className=m==="base"?"on":"";draw()}
function byDay(e,d,withGhost){
  var day=DAYS[d];
  var a=e.items.filter(function(x){return x.day===day}).map(function(x){return{a:x,g:0}});
  if(withGhost)a=a.concat(e.removed.filter(function(x){return x.day===day}).map(function(x){return{a:x,g:1}}));
  return a.sort(function(p,q){return t2m(p.a.s)-t2m(q.a.s)});
}
function rowHtml(o,live){
  var x=o.a,k=x.who==="첫째"?1:2;
  var cur=live&&!o.g&&NM>=t2m(x.s)&&NM<t2m(x.e),past=live&&!o.g&&NM>=t2m(x.e);
  var tag=o.g?'<em class="tag c">이번 주 휴강</em>':(cur?'<em class="tag n">지금</em>':(x._wk?'<em class="tag w">이번 주</em>':""));
  return '<div class="row'+(cur?" cur":past?" past":"")+(o.g?" ghost":"")+'"><span class="t">'+x.s+'</span><span class="kt kt'+k+'">'+NAME[x.who]+'</span><span><span class="ti">'+x.title+tag+'</span><div class="sub">'+x.s+"–"+x.e+(x.place?" · "+x.place:"")+(x.note?" · "+x.note:"")+"</div></span></div>";
}

function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function drawEvents(){
  var box=document.getElementById("events");if(!box)return;
  var t=ymd(NOW),lim=new Date(NOW);lim.setDate(NOW.getDate()+21);var limS=ymd(lim);
  var list=(EVENTS||[]).filter(function(e){return (e.end||e.start)>=t && e.start<=limS})
    .sort(function(a,b){return a.start<b.start?-1:1});
  if(!list.length){box.innerHTML="";return}
  var rows=list.map(function(e){
    var st=new Date(e.start+"T00:00:00"),dd=Math.round((st-new Date(t+"T00:00:00"))/86400000);
    var lab=(e.end&&e.end!==e.start)?(st.getMonth()+1)+"."+st.getDate()+"–"+(+e.end.slice(5,7))+"."+(+e.end.slice(8,10)):(st.getMonth()+1)+"."+st.getDate();
    var dtxt=dd<=0?"오늘":(dd===1?"내일":"D-"+dd);
    return '<div class="evrow"><span class="d">'+dtxt+'</span><span class="n">'+e.title+'</span><span class="w">'+lab+(e.s?" · "+e.s:"")+(e.who&&e.who!=="가족"?" · "+(NAME[e.who]||e.who):"")+'</span></div>';
  }).join("");
  box.innerHTML='<div class="evbox"><div class="t">다가오는 일정</div>'+rows+"</div>";
}
function shortTitle(t){var v=t.replace("정규수업","학교").replace(/^(방과후|맞춤형)\s*/,"");if(v.length>3)v=v.replace(/학원$/,"").replace(/수업$/,"");return v||t}
function draw(){
  var e=eff(),sun=dOf(6);
  document.getElementById("rng").textContent=(MON.getMonth()+1)+"월 "+MON.getDate()+"일 – "+(sun.getMonth()+1)+"월 "+sun.getDate()+"일 · "+DAYS[TD]+"요일";
  var wb=document.getElementById("wkbar");
  if(MODE==="week"&&WOPS.length){wb.style.display="block";wb.textContent="이번 주 변경 "+WOPS.length+"건 반영됨 · 다음 주엔 기본으로 돌아가요"}else wb.style.display="none";
  var t=byDay(e,TD,true),live=t.filter(function(o){return!o.g}).map(function(o){return o.a});
  var cur=live.filter(function(x){return NM>=t2m(x.s)&&NM<t2m(x.e)})[0];
  var nxt=live.filter(function(x){return t2m(x.s)>NM}).sort(function(a,b){return t2m(a.s)-t2m(b.s)})[0];
  var st="";
  if(cur)st+='<span class="st now">지금 · '+NAME[cur.who]+" "+cur.title+" ("+cur.e+"까지)</span>";
  if(nxt)st+='<span class="st">다음 · '+nxt.s+" "+NAME[nxt.who]+" "+nxt.title+"</span>";
  if(!cur&&!nxt)st='<span class="st">'+(live.length?"오늘 일정을 모두 마쳤어요":"오늘은 일정이 없어요")+"</span>";
  var td=dOf(TD);
  document.getElementById("hero").innerHTML='<div class="hero"><div class="ht"><span class="hn">'+td.getDate()+'</span><span class="hm"><div class="a">'+DAYS[TD]+'요일</div><div class="b">'+(td.getMonth()+1)+"월 "+td.getDate()+'일</div></span><span class="tdp">오늘</span></div><div class="stat">'+st+"</div>"+(t.map(function(o){return rowHtml(o,true)}).join("")||'<div class="row"><span></span><span></span><span class="none">일정 없음</span></div>')+"</div>";
  var wkDay={};WOPS.forEach(function(o){var x=(o.match||o.item||{});if(x.day)wkDay[x.day]=1});
  var list="";
  for(var i=1;i<7;i++){
    var d=(TD+i)%7,items=byDay(e,d,false),dt=dOf(d);
    var lines=["첫째","둘째"].map(function(w){
      var k=w==="첫째"?1:2;
      var mine=items.filter(function(o){return o.a.who===w&&o.a.cat!=="care"});
      if(!mine.length)return '<div class="kline"><span class="nm nm'+k+'">'+NAME[w]+'</span><span class="none">일정 없음</span></div>';
      var parts=mine.map(function(o){var x=o.a;return x.cat==="school"?(w==="첫째"?"하교 ":"하원 ")+x.e:shortTitle(x.title)+" "+x.s});
      var more=parts.length>3?parts.length-3:0;
      return '<div class="kline"><span class="nm nm'+k+'">'+NAME[w]+'</span><span class="ch2">'+parts.slice(0,3).join(' <span class="ar">&rarr;</span> ')+(more?' <span class="ar">+'+more+"</span>":"")+"</span></div>";
    }).join("");
    list+='<div class="card" onclick="this.classList.toggle(\'open\')"><div class="ch"><span class="cd'+(d>4?" we":"")+'">'+DAYS[d]+'</span><span class="cdt">'+(dt.getMonth()+1)+"월 "+dt.getDate()+'일</span><span class="cnt">일정 '+items.length+(MODE==="week"&&wkDay[DAYS[d]]?'<span class="wd"></span>':"")+'</span></div>'+lines+'<div class="cx">'+items.map(function(o){return rowHtml(o,false)}).join("")+"</div></div>";
  }
  document.getElementById("list").innerHTML=list;
  drawEvents();
}
draw();

var GH={owner:"Catomo88",repo:"time_table",path:"requests.json",branch:"main"},TKEY="ttbl_gh_token";
function el(i){return document.getElementById(i)}
function setMsg(t,c){var m=el("msg");m.textContent=t;m.className="msg "+(c||"")}
function b64e(s){return btoa(unescape(encodeURIComponent(s)))}
function b64d(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,""))))}
function saveTok(){var v=el("tok").value.trim();if(!v)return;localStorage.setItem(TKEY,v);el("tok").value="";el("tokstate").textContent="— 저장됨";setMsg("토큰이 저장됐어요. 이제 보내기를 쓸 수 있어요.","ok")}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t)}else{var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");document.body.removeChild(a)}}
function copyReq(){var t=el("req").value.trim();if(!t){el("req").focus();return}copyText(t);setMsg("복사됐어요.","ok")}
function sendReq(){
  var t=el("req").value.trim();if(!t){el("req").focus();return}
  var tok=localStorage.getItem(TKEY);
  if(!tok){el("setup").open=true;setMsg("먼저 아래에서 GitHub 토큰을 한 번 저장해 주세요.","err");return}
  setMsg("보내는 중…");
  var url="https://api.github.com/repos/"+GH.owner+"/"+GH.repo+"/contents/"+GH.path;
  var H={"Authorization":"Bearer "+tok,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
  fetch(url+"?ref="+GH.branch+"&t="+Date.now(),{headers:H}).then(function(r){
    if(r.status===401||r.status===403)throw new Error("토큰 권한을 확인해 주세요");
    return r.status===200?r.json():null;
  }).then(function(j){
    var sha=j?j.sha:null,arr=[];
    if(j){try{arr=JSON.parse(b64d(j.content))}catch(e){arr=[]}}
    arr.push({time:new Date().toISOString(),local:new Date().toLocaleString("ko-KR"),text:t,done:false});
    var body={message:"시간표 변경 요청: "+t.slice(0,50),content:b64e(JSON.stringify(arr,null,2)),branch:GH.branch};
    if(sha)body.sha=sha;
    return fetch(url,{method:"PUT",headers:H,body:JSON.stringify(body)});
  }).then(function(p){
    if(p&&p.ok){setMsg("접수됐어요! 잠시 뒤 자동으로 반영돼요.","ok");el("req").value=""}
    else{setMsg("보내기 실패. '복사'로 전달해 주세요.","err")}
  }).catch(function(e){setMsg((e.message||"오류")+" · '복사'로 전달해 주세요.","err")});
}
if(localStorage.getItem(TKEY))el("tokstate").textContent="— 저장됨";
