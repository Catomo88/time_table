<title>주간 시간표</title>
<style>
:root{--ink:#23262D;--mut:#8B8F98;--line:#EEEBE4;--wk:#7B53C6}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif;background:#FAF9F7;color:var(--ink);-webkit-font-smoothing:antialiased}

.fb i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}

.wkbar{font-size:11.5px;background:#F3EEFC;color:#5B3AA6;border:1px solid #E3D9F7;border-radius:9px;padding:7px 10px;margin:8px 0 2px;font-weight:700;display:none}
.grid{position:relative;display:grid;grid-template-columns:19px repeat(7,minmax(0,1fr));margin-top:8px}
.ch{text-align:center;font-size:12px;font-weight:800;padding:5px 0 4px;border-bottom:1px solid #E7E4DD;position:relative}
.ch.we{color:#C05B5B}
.ch em{display:block;font-style:normal;font-size:10px;color:var(--mut);font-weight:600}
.ch.td{color:#E5484D}.ch.td em{color:#E5484D}
.ch.td:after{content:"";position:absolute;left:3px;right:3px;bottom:-1px;height:2px;background:#E5484D;border-radius:2px}
.ch .wd{position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--wk)}
.tcol{position:relative}
.tl{position:absolute;right:2px;font-size:9.5px;color:#B3B6BC;transform:translateY(-5px)}
.col{position:relative;border-left:1px solid var(--line)}
.col.tdc{background:#FFFDF8}
.hr{position:absolute;left:0;right:0;height:1px;background:#F3F0E9}
.hr.h{background:#E9E5DC}
.brk{position:absolute;left:0;right:0;height:16px;z-index:5;pointer-events:none}

.brk .mid{position:absolute;left:0;right:0;top:9px;bottom:9px;background:#FAF9F7}
.zl{position:absolute;right:2px;font-size:8.5px;color:#C0C3C8;letter-spacing:-.5px}
.ev{position:absolute;left:2px;right:2px;border-radius:5px;padding:2px 4px;overflow:hidden;border-left:3px solid;line-height:1.12}

.ev span{font-size:.82em;opacity:.75;display:block;margin-top:0}
.k1.R{background:#E4E8FA;border-color:#8F9CE6;color:#31399C}
.k1.A{background:#CDD4F5;border-color:#5A6AD8;color:#242C7E}

.k2.M{background:#FDF6F2;border-color:#D9865A;border-left-style:dashed;color:#8E4A28}
.k1.H{background:#4C5FD5;border-color:#3B4BB5;color:#fff}
.k1.P{background:#F7F8FE;border-color:#C3CAF2;color:#5C68B4}
.k1.E{background:#EFEAF9;border-color:#A78BD8;color:#4D3781}
.k2.R{background:#FAE6DA;border-color:#E3A981;color:#A94D2C}
.k2.A{background:#F3CDB6;border-color:#D9865A;color:#7E3413}
.k2.H{background:#D97757;border-color:#B85E40;color:#fff}
.k2.P{background:#FEF9F6;border-color:#EDC3AF;color:#AE6A48}
.k2.E{background:#F6EDE6;border-color:#C79E85;color:#7A4E33}

.now{position:absolute;height:2px;background:#E5484D;border-radius:2px;z-index:6}
.now:before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:#E5484D}

@media print{body{background:#fff}.bar,.foot,.wkbar{display:none}@page{size:portrait}}

.evb{background:#FFF7EC;border:1px solid #F2DFC2;border-radius:11px;padding:8px 11px;margin-top:8px;font-size:12px;color:#8A5B10;font-weight:700;display:none}

.ch .ed{position:absolute;top:3px;left:5px;width:6px;height:6px;border-radius:50%;background:#E2A33C}

<script>
var DATA = [{"who": "첫째", "day": "월", "s": "08:20", "e": "08:45", "title": "등교", "cat": "care", "place": "집→학교", "assumed": false, "note": ""}, {"who": "첫째", "day": "월", "s": "08:45", "e": "13:30", "title": "정규수업", "cat": "school", "place": "○○초", "assumed": false, "note": ""}, {"who": "첫째", "day": "월", "s": "15:20", "e": "16:10", "title": "한글수업", "cat": "academy", "place": "한글교실", "assumed": false, "note": ""}, {"who": "첫째", "day": "화", "s": "08:20", "e": "08:45", "title": "등교", "cat": "care", "place": "집→학교", "assumed": false, "note": ""}, {"who": "첫째", "day": "화", "s": "08:45", "e": "13:30", "title": "정규수업", "cat": "school", "place": "○○초", "assumed": false, "note": ""}, {"who": "첫째", "day": "화", "s": "14:00", "e": "15:00", "title": "태권도", "cat": "academy", "place": "태권도장", "assumed": false, "note": ""}, {"who": "첫째", "day": "화", "s": "16:00", "e": "16:30", "title": "피아노", "cat": "academy", "place": "피아노학원", "assumed": false, "note": ""}, {"who": "첫째", "day": "수", "s": "08:20", "e": "08:45", "title": "등교", "cat": "care", "place": "집→학교", "assumed": false, "note": ""}, {"who": "첫째", "day": "수", "s": "08:45", "e": "12:50", "title": "정규수업(단축)", "cat": "school", "place": "○○초", "assumed": false, "note": ""}, {"who": "첫째", "day": "목", "s": "08:20", "e": "08:45", "title": "등교", "cat": "care", "place": "집→학교", "assumed": false, "note": ""}, {"who": "첫째", "day": "목", "s": "08:45", "e": "13:30", "title": "정규수업", "cat": "school", "place": "○○초", "assumed": false, "note": ""}, {"who": "첫째", "day": "목", "s": "13:40", "e": "15:10", "title": "방과후 큐보로봇", "cat": "after", "place": "학교", "assumed": false, "note": "유료"}, {"who": "첫째", "day": "목", "s": "17:10", "e": "18:10", "title": "영어수업", "cat": "academy", "place": "한글교실", "assumed": false, "note": ""}, {"who": "첫째", "day": "금", "s": "08:20", "e": "08:45", "title": "등교", "cat": "care", "place": "집→학교", "assumed": false, "note": ""}, {"who": "첫째", "day": "금", "s": "08:45", "e": "12:50", "title": "정규수업(단축)", "cat": "school", "place": "○○초", "assumed": false, "note": ""}, {"who": "첫째", "day": "금", "s": "12:50", "e": "14:20", "title": "맞춤형 종이접기", "cat": "after", "place": "학교", "assumed": false, "note": "무료"}, {"who": "첫째", "day": "금", "s": "14:40", "e": "16:00", "title": "미술학원", "cat": "academy", "place": "미술학원", "assumed": false, "note": ""}, {"who": "첫째", "day": "금", "s": "16:00", "e": "17:00", "title": "태권도", "cat": "academy", "place": "태권도장", "assumed": false, "note": "둘째와 함께 · 이모님 픽업"}, {"who": "둘째", "day": "월", "s": "09:10", "e": "15:10", "title": "유치원", "cat": "school", "place": "유치원", "assumed": false, "note": ""}, {"who": "둘째", "day": "월", "s": "16:20", "e": "16:50", "title": "한글수업", "cat": "academy", "place": "한글교실", "assumed": false, "note": ""}, {"who": "둘째", "day": "화", "s": "09:10", "e": "15:10", "title": "유치원", "cat": "school", "place": "유치원", "assumed": false, "note": ""}, {"who": "둘째", "day": "수", "s": "09:10", "e": "15:10", "title": "유치원", "cat": "school", "place": "유치원", "assumed": false, "note": ""}, {"who": "둘째", "day": "수", "s": "16:10", "e": "16:40", "title": "한글수업", "cat": "academy", "place": "한글교실", "assumed": false, "note": ""}, {"who": "둘째", "day": "목", "s": "09:10", "e": "15:10", "title": "유치원", "cat": "school", "place": "유치원", "assumed": false, "note": ""}, {"who": "둘째", "day": "금", "s": "09:10", "e": "15:10", "title": "유치원", "cat": "school", "place": "유치원", "assumed": false, "note": "하원 시간 늘림"}, {"who": "둘째", "day": "금", "s": "16:00", "e": "17:00", "title": "태권도", "cat": "academy", "place": "태권도장", "assumed": false, "note": "첫째와 함께 · 이모님 픽업"}, {"who": "첫째", "day": "수", "s": "19:30", "e": "20:10", "title": "첼로", "cat": "academy", "place": "첼로교실", "assumed": false, "note": ""}, {"who": "첫째", "day": "일", "s": "16:10", "e": "17:10", "title": "수영", "cat": "academy", "place": "수영장", "assumed": false, "note": ""}, {"who": "첫째", "day": "화", "s": "19:00", "e": "19:30", "title": "화상영어", "cat": "academy", "place": "온라인", "assumed": false, "note": ""}, {"who": "첫째", "day": "금", "s": "19:00", "e": "19:30", "title": "화상영어", "cat": "academy", "place": "온라인", "assumed": false, "note": ""}, {"who": "둘째", "day": "수", "s": "19:30", "e": "20:00", "title": "축구", "cat": "academy", "place": "축구교실", "assumed": true, "note": "추정"}, {"who": "첫째", "day": "수", "s": "16:50", "e": "17:40", "title": "한글수업", "cat": "academy", "place": "한글교실", "assumed": true, "note": "추정"}, {"who": "첫째", "day": "수", "s": "12:50", "e": "14:20", "title": "방과후 아나운서", "cat": "after", "place": "학교", "assumed": false, "note": "유료"}, {"who": "첫째", "day": "월", "s": "14:00", "e": "15:00", "title": "태권도", "cat": "academy", "place": "태권도장", "assumed": false, "note": ""}, {"who": "둘째", "day": "목", "s": "16:00", "e": "17:00", "title": "태권도", "cat": "academy", "place": "태권도장", "assumed": false, "note": ""}];
var OVERRIDES = {};
var EVENTS = [{"start": "2026-08-29", "end": "2026-08-29", "who": "가족", "title": "다영이네랑 충청도", "s": "", "e": "", "note": ""}];
var DAYS=["월","화","수","목","금","토","일"],NAME={"첫째":"서원","둘째":"서준"};
var CATC={"school":"R","after":"A","academy":"H","care":"P","etc":"E"};
var KID="첫째",MODE="week";
function mk(d){var x=new Date(d),w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2)}
var NOW=new Date(),TD=(NOW.getDay()+6)%7,NM=NOW.getHours()*60+NOW.getMinutes();
var MON=new Date(NOW);MON.setDate(NOW.getDate()-TD);
var WKEY=mk(NOW),WOPS=OVERRIDES[WKEY]||[];
function t2m(s){var p=s.split(":");return +p[0]*60+ +p[1]}
function mI(x,m){for(var k in m){if(x[k]!==m[k])return false}return true}
function eff(){
  if(MODE!=="week")return{items:DATA,removed:[]};
  var it=DATA.map(function(o){var c={};for(var k in o)c[k]=o[k];return c}),rm=[];
  WOPS.forEach(function(o){
    if(o.op==="add"){var n={place:"",note:""};for(var k in o.item)n[k]=o.item[k];n._wk=1;it.push(n)}
    else if(o.op==="remove"){it=it.filter(function(x){if(mI(x,o.match)){var g={};for(var k in x)g[k]=x[k];rm.push(g);return false}return true})}
    else if(o.op==="update"){it.forEach(function(x){if(mI(x,o.match)){for(var k in o.set)x[k]=o.set[k];x._wk=1}})}
  });
  return{items:it,removed:rm};
}
function bounds(list){
  var lo=8*60,hi=20*60+30;
  list.forEach(function(x){lo=Math.min(lo,t2m(x.s));hi=Math.max(hi,t2m(x.e))});
  return[Math.floor(lo/60)*60,Math.ceil(hi/30)*30];
}
function setKid(k,el){KID=k;var b=el.parentNode.querySelectorAll(".fb");for(var i=0;i<b.length;i++)b[i].className="fb"+(b[i].getAttribute("data-k")===k?" on":"");draw()}
function setMode(m){MODE=m;document.getElementById("mw").className=m==="week"?"on":"";document.getElementById("mb").className=m==="base"?"on":"";draw()}
function shortName(t){
  var s=t.replace("정규수업","학교").replace(/^(방과후|맞춤형)\s*/,"");
  if(s.length>3)s=s.replace(/학원$/,"").replace(/수업$/,"").replace(/교실$/,"");
  s=s.replace(/\s*돌봄$/,"");
  return s||t;
}
function fit(el){
  var fs=11.5;el.style.fontSize=fs+"px";
  while((el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1)&&fs>7){fs-=.5;el.style.fontSize=fs+"px"}
}

function ymd(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function weekEvents(){
  var a=ymd(MON),e2=new Date(MON);e2.setDate(MON.getDate()+6);var b=ymd(e2);
  return (EVENTS||[]).filter(function(e){return e.start<=b && (e.end||e.start)>=a});
}
function draw(){
  var e=eff(),BOTH=KID==="both";
  var mine=BOTH?e.items:e.items.filter(function(x){return x.who===KID});
  var rmv=BOTH?e.removed:e.removed.filter(function(x){return x.who===KID});
  var all=mine.concat(rmv),bd=bounds(all),T0=bd[0],T1=bd[1];
  var PX=0.95,CS=10*60,CE=13*60;
  var SEG=[];
  if(T0<Math.min(CS,T1))SEG.push([T0,Math.min(CS,T1),1]);
  if(T1>CS&&T0<CE)SEG.push([Math.max(CS,T0),Math.min(CE,T1),0.3]);
  if(T1>CE)SEG.push([Math.max(CE,T0),T1,1]);
  function Y(m){var y=0;for(var i=0;i<SEG.length;i++){var a=SEG[i][0],b=SEG[i][1],k=SEG[i][2];if(m<=a)break;y+=(Math.min(m,b)-a)*k*PX}return y}
  var H=Y(T1);
  document.getElementById("ttl").textContent=(BOTH?"두 아이":NAME[KID])+" · 주간 시간표";
  var sun=new Date(MON);sun.setDate(MON.getDate()+6);
  document.getElementById("rng").textContent=(MON.getMonth()+1)+"."+MON.getDate()+" – "+(sun.getMonth()+1)+"."+sun.getDate();
  var wb=document.getElementById("wkbar");
  if(MODE==="week"&&WOPS.length){wb.style.display="block";wb.textContent="이번 주 변경 "+WOPS.length+"건 반영됨 · 다음 주엔 기본으로 돌아가요"}
  else if(MODE==="week"){wb.style.display="none"}else{wb.style.display="none"}
  var wkDay={};WOPS.forEach(function(o){var t=(o.match||o.item||{});if((BOTH||t.who===KID)&&t.day)wkDay[t.day]=1});
  var g=document.getElementById("grid"),html='<div class="ch"></div>';
  for(var d=0;d<7;d++){
    var dt=new Date(MON);dt.setDate(MON.getDate()+d);
    var ds=ymd(dt),hasEv=(EVENTS||[]).some(function(e){return e.start<=ds&&(e.end||e.start)>=ds});
    html+='<div class="ch'+(d>4?" we":"")+(d===TD?" td":"")+'">'+DAYS[d]+"<em>"+dt.getDate()+"</em>"+(MODE==="week"&&wkDay[DAYS[d]]?'<span class="wd"></span>':"")+(hasEv?'<span class="ed"></span>':"")+"</div>";
  }
  html+='<div class="tcol" style="height:'+H+'px">';
  for(var h=T0/60;h<=T1/60;h++){
    var hm=h*60;
    if(hm>CS&&hm<CE)continue;
    html+='<div class="tl" style="top:'+Y(hm)+'px">'+h+"</div>";
  }
  html+="</div>";
  for(var d=0;d<7;d++){
    var day=DAYS[d];
    var list=mine.filter(function(x){return x.day===day}).map(function(x){return{a:x,g:0}})
      .concat(rmv.filter(function(x){return x.day===day}).map(function(x){return{a:x,g:1}}))
      .sort(function(a,b){return t2m(a.a.s)-t2m(b.a.s)});
    var s='<div class="col'+(d===TD?" tdc":"")+'" style="height:'+H+'px">';
    for(var h=T0/60;h<=T1/60;h++){var hm=h*60;if(hm>CS&&hm<CE)continue;s+='<div class="hr'+(h%2===0?" h":"")+'" style="top:'+Y(hm)+'px"></div>'}
    list.forEach(function(o){
      var x=o.a,top=Y(t2m(x.s)),ht=Math.max(Y(t2m(x.e))-Y(t2m(x.s))-2,17);
      var code=(CATC[x.cat]||"E");if(x.cat==="after"&&/^맞춤형/.test(x.title))code="M";
      var kn=x.who==="첫째"?1:2;
      var cls="ev k"+kn+" "+code+(o.g?" ghost":(x._wk?" wkadd":""));
      var side=BOTH?(kn===1?"left:1px;right:50%":"left:50%;right:1px"):"left:2px;right:2px";
      s+='<div class="'+cls+'" style="top:'+top+"px;height:"+ht+"px;"+side+'" title="'+(BOTH?NAME[x.who]+" · ":"")+x.title+" "+x.s+"–"+x.e+(x.place?" · "+x.place:"")+'"><b>'+shortName(x.title)+"</b>"+'<span>'+(BOTH?x.s:(x.s+"–"+x.e))+"</span>"+"</div>";
    });
    html+=s+"</div>";
  }
  g.innerHTML=html;
  var evs=g.querySelectorAll(".ev");for(var i=0;i<evs.length;i++)fit(evs[i]);
  var old=g.querySelector(".now");if(old)old.remove();
  if(T1>CS&&T0<CE){
    var hh=g.querySelector(".ch").offsetHeight,za=Y(Math.max(CS,T0)),zb=Y(Math.min(CE,T1));
    var br=document.createElement("div");br.className="brk";
    br.style.top=(hh+(za+zb)/2-8)+"px";br.style.left="19px";
    br.innerHTML='<div class="w t"></div><div class="mid"></div><div class="w b"></div>';
    g.appendChild(br);
  }
  if(TD<7&&NM>=T0&&NM<=T1){
    var n=document.createElement("div");n.className="now";
    var colw=(g.clientWidth-19)/7;
    n.style.top=(g.querySelector(".ch").offsetHeight+Y(NM))+"px";
    n.style.left=(19+colw*TD)+"px";n.style.width=colw+"px";
    g.appendChild(n);
  }
  var we=weekEvents(),eb=document.getElementById("evb");
  if(we.length){eb.style.display="block";eb.innerHTML=we.map(function(e){
    var d=new Date(e.start+"T00:00:00");return "<span>"+(d.getMonth()+1)+"/"+d.getDate()+" "+e.title+"</span>"}).join("")}
  else eb.style.display="none";
  document.getElementById("lg").innerHTML=BOTH?'<span><i style="background:#4C5FD5"></i>서원(왼쪽)</span><span><i style="background:#D97757"></i>서준(오른쪽)</span><span><i style="background:#CDD4F5"></i>방과후(유료)</span><span><i style="background:#F4F6FE;border:1px dashed #5A6AD8"></i>맞춤형(무료)</span>':KID==="첫째"
    ?'<span><i style="background:#E4E8FA"></i>학교</span><span><i style="background:#CDD4F5"></i>방과후(유료)</span><span><i style="background:#F4F6FE;border:1px dashed #5A6AD8"></i>맞춤형(무료)</span><span><i style="background:#4C5FD5"></i>학원</span><span><i style="background:#F7F8FE;border:1px solid #C3CAF2"></i>등하교</span>'
    :'<span><i style="background:#FAE6DA"></i>어린이집</span><span><i style="background:#D97757"></i>학원</span><span><i style="background:#F6EDE6"></i>기타</span>';
}
draw();window.addEventListener("resize",draw);
</script>
</body>
</html>
